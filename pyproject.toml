[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "falcon-mcp"
version = "0.5.0"
description = "Local MCP control and on-demand timbre feedback for UVI Falcon 2027"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["mcp>=1.26,<2", "numpy>=1.26,<3", "scipy>=1.12,<2", "soundfile>=0.12,<1", "pyloudnorm>=0.1.1,<1", "matplotlib>=3.9,<4", "lupa>=2.2,<3"]

[project.optional-dependencies]
feedback = ["torch>=2.6,<3", "transformers>=4.49,<5"]
capture = ["PyAudioWPatch>=0.2.12.7; sys_platform == 'win32'"]
host = ["pedalboard>=0.9.26,<0.10"]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "beautifulsoup4>=4.12", "requests>=2.32", "ruff>=0.12"]

[project.scripts]
falcon-mcp = "falcon_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
falcon_mcp = ["lua/*.lua", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
